name: Build and Push Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish for a manual test run. Defaults to test-<short-sha>."
        required: false
        type: string
      push_latest:
        description: "Also update :latest. Leave false for test runs."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_GHCR: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.tags.outputs.short_sha }}
      version: ${{ steps.tags.outputs.version }}
      push_latest: ${{ steps.tags.outputs.push_latest }}
    steps:
      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"

          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#dograh-}"
            VERSION="${VERSION#v}"
            PUSH_LATEST="true"
          else
            VERSION="${{ inputs.image_tag }}"
            if [ -z "$VERSION" ]; then
              VERSION="test-${SHORT_SHA}"
            fi
            PUSH_LATEST="${{ inputs.push_latest }}"
          fi

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${PUSH_LATEST}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: dograh-api
            dockerfile: api/Dockerfile
            context: .
          - name: dograh-ui
            dockerfile: ui/Dockerfile
            context: .
        platform:
          - name: linux/amd64
            runner: ubuntu-24.04
            short: amd64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build for architecture verification
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          load: true
          tags: local/${{ matrix.service.name }}:verify-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ matrix.platform.short }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-${{ matrix.platform.short }}

      - name: Verify image architecture
        env:
          IMAGE: local/${{ matrix.service.name }}:verify-${{ needs.prepare.outputs.short_sha }}
        run: |
          architecture="$(docker image inspect "$IMAGE" --format '{{.Architecture}}')"
          os="$(docker image inspect "$IMAGE" --format '{{.Os}}')"
          test "$architecture" = amd64
          test "$os" = linux

      - name: Push verified image tags
        env:
          IMAGE: local/${{ matrix.service.name }}:verify-${{ needs.prepare.outputs.short_sha }}
          DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}
          GH_IMAGE: ${{ env.REGISTRY_GHCR }}/${{ secrets.GHCR_USERNAME }}/${{ matrix.service.name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          PUSH_LATEST: ${{ needs.prepare.outputs.push_latest }}
        run: |
          tags=("$VERSION" "$SHORT_SHA")
          if [ "$PUSH_LATEST" = "true" ]; then
            tags+=(latest)
          fi

          for image in "$DH_IMAGE" "$GH_IMAGE"; do
            for tag in "${tags[@]}"; do
              docker tag "$IMAGE" "$image:$tag"
              docker push "$image:$tag"
            done
          done

  notify:
    needs:
      - prepare
      - build
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Slack success
        if: needs.build.result == 'success' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ Docker images built for ${{ needs.prepare.outputs.version }} on ${{ github.ref_name }} by ${{ github.actor }}"
            }

      - name: Slack failure
        if: needs.build.result != 'success' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ Docker build failed for ${{ needs.prepare.outputs.version }} on ${{ github.ref_name }} by ${{ github.actor }} - <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
            }
