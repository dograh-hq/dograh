<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sakinah Data Explorer</title><style>
body{font:14px system-ui,sans-serif;max-width:1200px;margin:2rem auto;padding:0 1rem;color:#18232a;background:#f7fafb}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}.hint{color:#52616b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:1.5rem 0}.card,section{background:#fff;border:1px solid #dde5e8;border-radius:8px;padding:16px}.number{font-size:28px;font-weight:700}input,button{padding:8px;border:1px solid #aebdc4;border-radius:5px}button{background:#075e67;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;background:white}td,th{padding:10px;border-bottom:1px solid #e1e8eb;text-align:left}a{color:#075e67}pre{white-space:pre-wrap;word-break:break-word;max-height:600px;overflow:auto}.hidden{display:none}</style></head><body>
<header><div><h1>Sakinah Data Explorer</h1><p class="hint">CALMOS DATA EXPLORER · read-only administrative view</p></div><button onclick="setToken()">Administrator token</button></header>
<section><input id="search" placeholder="Call ID, caller, telephone number" size="42"><button onclick="loadCalls()">Search calls</button><a href="#" onclick="showSchema();return false">Schema inspector</a></section>
<div id="metrics" class="grid"></div><section><table><thead><tr><th>Call</th><th>Agent</th><th>Caller</th><th>Started</th><th>Status</th></tr></thead><tbody id="calls"></tbody></table></section><section id="detail" class="hidden"></section><script>
let token=sessionStorage.token||''; const api=(path)=>fetch(path,{headers:{Authorization:'Bearer '+token}}).then(async r=>{if(!r.ok)throw Error((await r.json()).detail||r.status);return r.json()});
function setToken(){token=prompt('Enter administrator token');if(token)sessionStorage.token=token;load()}
function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function load(){try{let m=await api('/api/dashboard');metrics.innerHTML=Object.entries(m).map(([k,v])=>`<div class=card><div class=hint>${esc(k.replaceAll('_',' '))}</div><div class=number>${v}</div></div>`).join('');loadCalls()}catch(e){metrics.innerHTML='<div class=card>Authentication required. Use “Administrator token”.</div>'}}
async function loadCalls(){try{let q=encodeURIComponent(search.value);let d=await api('/api/calls?caller='+q+'&call_id='+q);calls.innerHTML=d.items.map(x=>`<tr><td><a href="#" onclick="callDetail('${esc(x.call_id)}');return false">${esc(x.call_id)}</a></td><td>${esc(x.agent)}</td><td>${esc(x.caller_id||x.caller_identifier)}</td><td>${esc(x.started_at)}</td><td>${esc(x.call_status)}</td></tr>`).join('')}catch(e){calls.innerHTML='<tr><td colspan=5>'+esc(e.message)+'</td></tr>'}}
async function callDetail(id){try{let [c,con,mem,files,exp]=await Promise.all([api('/api/calls/'+id),api('/api/calls/'+id+'/conversation'),api('/api/calls/'+id+'/memory'),api('/api/calls/'+id+'/files'),api('/api/calls/'+id+'/export')]);detail.classList.remove('hidden');detail.innerHTML=`<h2>Call ${esc(id)}</h2><p><a href="/api/calls/${encodeURIComponent(id)}/export?download=true" onclick="return authDownload(this)">Download complete call JSON</a> · <a href="/api/calls/${encodeURIComponent(id)}/package" onclick="return authDownload(this)">Download call package</a></p><h3>Overview</h3><pre>${esc(JSON.stringify(c,null,2))}</pre><h3>Conversation</h3><pre>${esc(JSON.stringify(con,null,2))}</pre><h3>User Memory</h3><pre>${esc(JSON.stringify(mem,null,2))}</pre><h3>Associated Files</h3>${files.map(f=>`<p>${esc(f.file_name)} <a href="/api/calls/${encodeURIComponent(id)}/files/${encodeURIComponent(f.file_id)}/download" onclick="return authDownload(this)">download</a>${f.kind==='audio'?` <a href="/api/calls/${encodeURIComponent(id)}/files/${encodeURIComponent(f.file_id)}/download?inline=true" onclick="return audio(this)">play</a>`:''}</p>`).join('')}<h3>Raw JSON</h3><pre>${esc(JSON.stringify(exp,null,2))}</pre>`;detail.scrollIntoView()}catch(e){alert(e.message)}}
function authDownload(a){fetch(a.href,{headers:{Authorization:'Bearer '+token}}).then(async r=>{if(!r.ok)throw Error('Download unavailable');let b=await r.blob(),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='sakinah-export';x.click();URL.revokeObjectURL(u)}).catch(e=>alert(e.message));return false} function audio(a){let u=new URL(a.href);u.searchParams.set('return_url','true');api(u.pathname+u.search).then(r=>{let el=document.createElement('audio');el.controls=true;el.src=r.url;a.after(el);el.play()}).catch(e=>alert(e.message));return false}async function showSchema(){try{detail.classList.remove('hidden');detail.innerHTML='<h2>Schema inspector</h2><pre>'+esc(JSON.stringify(await api('/api/schema'),null,2))+'</pre>'}catch(e){alert(e.message)}} load();
</script></body></html>
