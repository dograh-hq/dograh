[project]
name = "calmos-data-explorer"
version = "1.0.0"
description = "Read-only administrative explorer for CALMOS durable call data"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aioboto3>=13.0",
  "fastapi>=0.115",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
