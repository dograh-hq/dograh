services:
  api:
    image: local/dograh-api:1.46.0.4.1
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      SAKINAH_SESSIONS_DIR: /app/data/sakinah-sessions
    volumes:
      - ./data/sakinah-sessions:/app/data/sakinah-sessions

  ui:
    image: local/dograh-ui:1.46.0.4.1
    platform: linux/amd64
    restart: unless-stopped
    build:
      context: .
      dockerfile: ui/Dockerfile
